name: Deploy Assiris to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "overrides/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download site archive
        run: |
          curl -fL --retry 3 \
            "https://d2ol7oe51mr4n9.cloudfront.net/user_3JHdFVA3SitavsnAmI8m3dn2ZBE/302b2a44-a34b-4209-ae84-424ddc4b587d.zip" \
            -o /tmp/assiris-static-book.zip

      - name: Extract site archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("/tmp/assiris-static-book.zip")
          with ZipFile(archive) as z:
              if not any(name.startswith("assiris-site/") for name in z.namelist()):
                  raise SystemExit("Unexpected archive structure.")
              z.extractall(".site-source")
          source = Path(".site-source/assiris-site")
          if not (source / "package.json").exists():
              raise SystemExit("package.json was not found.")
          PY

      - name: Apply ASSIRIS experience update
        run: |
          mkdir -p .site-source/assiris-site/overrides
          cp overrides/Echo.tsx .site-source/assiris-site/overrides/Echo.tsx
          cp overrides/Landing.tsx .site-source/assiris-site/overrides/Landing.tsx
          cp overrides/experience.css .site-source/assiris-site/overrides/experience.css
          cp overrides/patch.py .site-source/assiris-site/overrides/patch.py
          cd .site-source/assiris-site
          python3 overrides/patch.py

      - name: Prepare GitHub Pages paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path(".site-source/assiris-site")
          for path in source.rglob("*"):
              if path.is_file() and path.suffix in {".tsx", ".ts", ".css", ".html", ".js"}:
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  text = text.replace('"/', '"/assiris/').replace("' /", "'/assiris/").replace("'/", "'/assiris/")
                  path.write_text(text, encoding="utf-8")
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static site
        working-directory: .site-source/assiris-site
        run: |
          npm ci
          npm run build
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site-source/assiris-site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
